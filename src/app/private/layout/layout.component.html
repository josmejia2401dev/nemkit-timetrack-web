<div class="min-h-screen flex">
  <!-- Sidebar -->
  <aside [class]="sidebarOpen() ? 'deploy-sidebar flex flex-col w-64 fixed inset-y-0 z-30' : 'deploy-sidebar hidden lg:flex flex-col w-64 fixed inset-y-0 z-30'">

    <!-- Brand -->
    <div class="deploy-sidebar-brand flex-col !items-stretch !gap-3">
      <div class="flex items-center gap-3">
        <div class="deploy-sidebar-brand__icon">
          <i class="pi pi-clock"></i>
        </div>
        <span class="deploy-sidebar-brand__title">Nemkit TimeTrack</span>
      </div>
      <app-backend-status-tag pollProfile="relaxed" />
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-0.5 overflow-y-auto">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path" routerLinkActive="deploy-nav-item--active"
           class="deploy-nav-item" (click)="closeSidebar()">
          <i [class]="item.icon"></i>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <!-- Logout -->
    <div class="px-3 py-4 border-t" style="border-color: var(--deploy-border)">
      <button (click)="logout()"
              class="deploy-nav-item w-full text-red-500 hover:!bg-red-50 hover:!text-red-600">
        <i class="pi pi-sign-out"></i>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- Mobile header -->
  <header class="lg:hidden fixed top-0 left-0 right-0 z-20 flex items-center justify-between px-4 py-3 bg-white/80 backdrop-blur-md border-b" style="border-color: var(--deploy-border)">
    <button (click)="toggleSidebar()" class="p-2 rounded-lg hover:bg-gray-100 transition-colors">
      <i class="pi pi-bars"></i>
    </button>
    <div class="flex flex-col items-center gap-1">
      <div class="flex items-center gap-2">
        <div class="deploy-sidebar-brand__icon" style="width:28px;height:28px;font-size:0.75rem">
          <i class="pi pi-clock"></i>
        </div>
        <span class="text-sm font-bold">Nemkit TimeTrack</span>
      </div>
      <app-backend-status-tag [compact]="true" />
    </div>
    <button (click)="logout()" class="p-2 rounded-lg hover:bg-red-50 transition-colors">
      <i class="pi pi-sign-out text-red-500"></i>
    </button>
  </header>

  <!-- Backdrop -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/20 backdrop-blur-sm z-20 lg:hidden" (click)="closeSidebar()"></div>
  }

  <!-- Global timer widget (floating top-right) -->
  <div class="fixed top-4 right-4 z-40 hidden sm:block">
    <app-timer-widget />
  </div>

  <!-- Main content -->
  <main class="flex-1 lg:ml-64 pt-14 lg:pt-0">
    <div class="p-4 sm:p-6 max-w-7xl mx-auto">
      <router-outlet />
    </div>
  </main>
</div>
