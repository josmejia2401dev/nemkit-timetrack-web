<div class="min-h-screen flex items-center justify-center px-4" style="background-color: var(--deploy-bg)">
  <div class="w-full max-w-sm deploy-card p-8">
    <div class="text-center mb-8">
      <div class="w-14 h-14 mx-auto mb-4 rounded-xl flex items-center justify-center" style="background-color: var(--deploy-primary-50)">
        <i class="pi pi-clock text-2xl" style="color: var(--deploy-primary)"></i>
      </div>
      <h1 class="text-2xl font-bold" style="color: var(--deploy-text)">Nemkit TimeTrack</h1>
      <p class="text-sm mt-1" style="color: var(--deploy-text-muted)">Track your time by project</p>
      <div class="mt-3 flex justify-center">
        <app-backend-status-tag pollProfile="aggressive" />
      </div>
    </div>

    @if (error()) {
      <p-message severity="error" [text]="error()!" class="mb-4 block" />
    }

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium" style="color: var(--deploy-text)">Email</label>
        <input pInputText [(ngModel)]="email" name="email" placeholder="admin@nemkit.local" class="w-full" required />
      </div>
      <div class="flex flex-col gap-1.5">
        <label class="text-sm font-medium" style="color: var(--deploy-text)">Password</label>
        <p-password [(ngModel)]="password" name="password" [toggleMask]="true" [feedback]="false"
                    styleClass="w-full" inputStyleClass="w-full" required />
      </div>
      <p-button type="submit" label="Sign in" [loading]="loading()" styleClass="w-full" severity="primary" />
    </form>
  </div>
</div>
